<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Findest Sport — Catalog</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080B0F;--surface:#0F1419;--surface2:#161D26;--border:#1E2D3D;--teal:#00D4B1;--teal-dim:rgba(0,212,177,.12);--gold:#F5A623;--red:#FF3B5C;--text:#EFF6FF;--muted:#607898;--dim:#2A3D52}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
.loading-screen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s}
.loading-screen.hidden{opacity:0;pointer-events:none}
.loading-logo{font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--teal);letter-spacing:4px}
.loading-sub{font-size:12px;color:var(--muted);letter-spacing:2px}
.loading-bar{width:200px;height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:8px}
.loading-bar-fill{height:100%;background:var(--teal);border-radius:2px;animation:loadbar 1.5s ease-in-out infinite}
@keyframes loadbar{0%{width:0%}50%{width:70%}100%{width:100%}}
.hero{position:relative;padding:48px 20px 32px;background:linear-gradient(160deg,#0a1525 0%,#080B0F 60%);overflow:hidden}
.hero::before{content:'';position:absolute;top:-80px;right:-60px;width:300px;height:300px;background:radial-gradient(circle,rgba(0,212,177,.15) 0%,transparent 70%);pointer-events:none}
.hero-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.hero-logo-icon{width:44px;height:44px;background:var(--teal);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#080B0F;font-family:'Bebas Neue',sans-serif;letter-spacing:1px}
.hero-logo-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--teal)}
.hero-logo-sub{font-size:11px;color:var(--muted)}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(42px,10vw,72px);line-height:.95;letter-spacing:2px;margin-bottom:12px}
.hero-title span{color:var(--teal)}
.hero-desc{font-size:14px;color:var(--muted);line-height:1.6;max-width:320px;margin-bottom:24px}
.hero-badges{display:flex;gap:8px;flex-wrap:wrap}
.badge-pill{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid;letter-spacing:.3px}
.badge-pill.teal{border-color:var(--teal);color:var(--teal);background:var(--teal-dim)}
.badge-pill.gold{border-color:var(--gold);color:var(--gold);background:rgba(245,166,35,.1)}
.search-wrap{padding:12px 16px;position:sticky;top:0;z-index:100;background:rgba(8,11,15,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.search-box{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 16px}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif}
.search-box input::placeholder{color:var(--muted)}
.cat-scroll{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;white-space:nowrap}
.cat-btn.active{background:var(--teal);border-color:var(--teal);color:#080B0F}
.section-label{padding:16px 16px 2px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--muted)}
.section-count{font-size:11px;color:var(--muted);padding:0 16px 10px}
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px 120px}
@media(min-width:480px){.product-grid{grid-template-columns:repeat(3,1fr)}}
.product-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s;position:relative;animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.product-card:active{transform:scale(.96)}
.product-card.in-cart{border-color:var(--teal);box-shadow:0 0 16px rgba(0,212,177,.15)}
.card-img-wrap{position:relative;padding-top:100%;background:var(--surface2);overflow:hidden}
.card-img{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px}
.card-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.card-badge-brand{position:absolute;top:7px;left:7px;padding:2px 7px;border-radius:5px;font-size:9px;font-weight:700;letter-spacing:.5px}
.brand-ON{background:#C8960C;color:#fff}
.brand-BSN{background:#1565C0;color:#fff}
.brand-ISOPURE{background:#2E7D32;color:#fff}
.card-video{position:absolute;top:7px;right:7px;background:rgba(255,59,92,.85);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px}
.card-qty-badge{position:absolute;bottom:7px;right:7px;background:var(--teal);color:#080B0F;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.card-body{padding:9px 10px 11px}
.card-name{font-size:11px;font-weight:700;line-height:1.3;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-variant{font-size:9px;color:var(--muted);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-price{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;color:var(--teal)}
.card-price-zero{font-size:10px;color:var(--muted);font-family:'DM Sans',sans-serif;margin-top:2px}
.card-add-btn{width:100%;margin-top:7px;padding:6px;border-radius:7px;border:1px solid var(--teal);background:var(--teal-dim);color:var(--teal);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.card-add-btn.added{background:var(--teal);color:#080B0F}
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:none;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal-sheet{width:100%;max-height:90vh;background:var(--surface);border-radius:22px 22px 0 0;overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1)}
.modal-overlay.open .modal-sheet{transform:translateY(0)}
.modal-drag{width:36px;height:4px;background:var(--dim);border-radius:2px;margin:12px auto 0}
.modal-img{width:100%;height:220px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:88px;position:relative;overflow:hidden}
.modal-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.modal-body{padding:18px 18px 32px}
.modal-brand-tag{display:inline-block;padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.5px;margin-bottom:8px}
.modal-name{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1.5px;line-height:1.1;margin-bottom:5px}
.modal-variant{font-size:12px;color:var(--muted);margin-bottom:12px}
.modal-price{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1px;color:var(--teal);margin-bottom:14px}
.modal-price span{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--muted)}
.modal-desc{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:16px;padding:12px;background:var(--surface2);border-radius:9px}
.modal-video-btn{display:flex;align-items:center;gap:8px;padding:11px 14px;background:rgba(255,59,92,.1);border:1px solid rgba(255,59,92,.3);border-radius:9px;color:var(--red);font-size:12px;font-weight:600;cursor:pointer;margin-bottom:16px;transition:all .2s}
.qty-control{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qty-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.qty-btn:active{transform:scale(.88)}
.qty-num{font-size:20px;font-weight:700;min-width:28px;text-align:center}
.add-to-cart-btn{width:100%;padding:15px;border-radius:13px;border:none;background:var(--teal);color:#080B0F;font-size:15px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.add-to-cart-btn:active{transform:scale(.98)}
.cart-fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:150;display:flex;align-items:center;gap:10px;background:var(--teal);color:#080B0F;padding:13px 22px;border-radius:50px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 8px 28px rgba(0,212,177,.35);transition:transform .2s,opacity .3s;white-space:nowrap;min-width:190px;justify-content:space-between;border:none}
.cart-fab.hidden{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(80px)}
.cart-fab:active{transform:translateX(-50%) scale(.97)}
.cart-fab-count{background:#080B0F;color:var(--teal);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.cart-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
.cart-item-thumb{width:44px;height:44px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;overflow:hidden}
.cart-item-thumb img{width:100%;height:100%;object-fit:cover}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item-variant{font-size:10px;color:var(--muted)}
.cart-item-price{font-size:12px;color:var(--teal);font-weight:700;margin-top:2px}
.cart-item-qty{display:flex;align-items:center;gap:7px;flex-shrink:0}
.ci-qty-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ci-qty-num{font-size:13px;font-weight:700;min-width:18px;text-align:center}
.order-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:14px;padding:11px 13px;margin-bottom:9px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s}
.order-input:focus{border-color:var(--teal)}
.order-input::placeholder{color:var(--muted)}
.checkout-btn{width:100%;padding:15px;border-radius:13px;border:none;background:linear-gradient(135deg,var(--teal),#00B894);color:#080B0F;font-size:15px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.checkout-btn:active{transform:scale(.98)}
.cart-total{display:flex;justify-content:space-between;align-items:center;padding:13px 0;font-weight:700;border-top:1px solid var(--border);margin-top:4px}
.cart-total-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--teal)}
.video-overlay{position:fixed;inset:0;z-index:500;background:#000;display:none;flex-direction:column}
.video-overlay.open{display:flex}
.video-close{position:absolute;top:16px;right:16px;width:38px;height:38px;background:rgba(255,255,255,.2);border-radius:50%;border:none;color:#fff;font-size:18px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center}
.video-overlay iframe{flex:1;width:100%;border:none}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--surface);border:1px solid var(--teal);color:var(--text);padding:9px 18px;border-radius:20px;font-size:12px;font-weight:600;z-index:1000;transition:transform .3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);grid-column:1/-1}
.no-price{color:var(--muted);font-size:11px;font-family:'DM Sans',sans-serif}

/* ── STOK BADGE ── */
.stok-badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;z-index:3;backdrop-filter:blur(4px)}
.stok-habis{background:rgba(255,59,92,.85);color:#fff}
.stok-terbatas{background:rgba(245,166,35,.85);color:#fff}
.product-card.habis .card-img{filter:grayscale(60%)}
.btn-habis{background:rgba(255,59,92,.15)!important;color:#FF3B5C!important;border:1px solid rgba(255,59,92,.3)!important;cursor:not-allowed!important;opacity:.8}
.btn-habis:hover{transform:none!important;box-shadow:none!important}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">FINDEST</div>
  <div class="loading-sub">SPORT SUPPLEMENT</div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
</div>

<div class="hero">
  <div class="hero-logo">
    <div class="hero-logo-icon">FS</div>
    <div>
      <div class="hero-logo-name">FINDEST SPORT</div>
      <div class="hero-logo-sub">Official Distributor — Bali</div>
    </div>
  </div>
  <h1 class="hero-title">FUEL YOUR<br><span>POTENTIAL.</span></h1>
  <p class="hero-desc">Supplement premium ON, BSN & ISOPURE. Harga distributor langsung — 100% authentic.</p>
  <div class="hero-badges">
    <span class="badge-pill teal">✓ 100% Authentic</span>
    <span class="badge-pill teal">✓ Exclusive ON Bali</span>
    <span class="badge-pill gold">⚡ Order via WhatsApp</span>
  </div>
</div>

<div class="search-wrap">
  <div class="search-box">
    <span style="font-size:17px">🔍</span>
    <input type="text" id="searchInput" placeholder="Cari produk, brand, flavor..." oninput="filterProducts()"/>
    <span id="clearSearch" style="color:var(--muted);cursor:pointer;display:none;font-size:16px" onclick="clearSearch()">✕</span>
  </div>
</div>

<div class="cat-scroll">
  <button class="cat-btn active" onclick="setCategory('all',this)">🏆 Semua</button>
  <button class="cat-btn" onclick="setCategory('ON',this)">🥇 ON</button>
  <button class="cat-btn" onclick="setCategory('BSN',this)">💪 BSN</button>
  <button class="cat-btn" onclick="setCategory('ISOPURE',this)">🧬 ISOPURE</button>
  <button class="cat-btn" onclick="setCategory('Protein',this)">🥩 Protein</button>
  <button class="cat-btn" onclick="setCategory('Mass Gainer',this)">📈 Gainer</button>
  <button class="cat-btn" onclick="setCategory('Creatine',this)">⚡ Creatine</button>
  <button class="cat-btn" onclick="setCategory('Amino',this)">🔬 Amino</button>
  <button class="cat-btn" onclick="setCategory('Pre-Workout',this)">🔥 Pre-WO</button>
  <button class="cat-btn" onclick="setCategory('Vitamin',this)">💊 Vitamin</button>
</div>

<div class="section-label" id="sectionLabel">SEMUA PRODUK</div>
<div class="section-count" id="sectionCount">Memuat produk...</div>
<div class="product-grid" id="productGrid"></div>

<button class="cart-fab hidden" id="cartFab" onclick="openCart()">
  <span>🛒 Pesanan</span>
  <div style="display:flex;align-items:center;gap:6px">
    <span id="cartTotal" style="font-size:12px">Rp 0</span>
    <div class="cart-fab-count" id="cartCount">0</div>
  </div>
</button>

<div class="modal-overlay" id="productModal" onclick="handleModalBg(event,'productModal')">
  <div class="modal-sheet"><div class="modal-drag"></div><div id="productModalContent"></div></div>
</div>

<div class="modal-overlay" id="cartModal" onclick="handleModalBg(event,'cartModal')">
  <div class="modal-sheet" style="max-height:88vh"><div class="modal-drag"></div><div style="padding:0 18px 32px" id="cartContent"></div></div>
</div>

<div class="video-overlay" id="videoOverlay">
  <button class="video-close" onclick="closeVideo()">✕</button>
  <iframe id="videoFrame" allow="autoplay"></iframe>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://wuejoxgbtvmlrriwlofk.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1ZWpveGdidHZtbHJyaXdsb2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNjY1NTQsImV4cCI6MjA5Mjg0MjU1NH0.nq0xlsuXeJNXtb8SisPQ3Ml5fXNy2vguVRJ8pNFGai0';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let allProducts=[],cart={},currentCategory='all',searchQ='',selectedProduct=null,modalQty=1;
let salesWA='',salesName='Findest Sport';
const EMOJI={ON:'🏆',BSN:'💪',ISOPURE:'🧬'};
const BCLS={ON:'brand-ON',BSN:'brand-BSN',ISOPURE:'brand-ISOPURE'};

function fmt(n){return'Rp '+Math.round(n||0).toLocaleString('id-ID')}

async function init(){
  try{
    const[cfg,prods]=await Promise.all([
      sb.from('config').select('key,value'),
      sb.from('products').select('id,nama,brand,kategori,harga,foto_url,deskripsi,status,video_url,stok').eq('status','Aktif').order('brand').order('nama')
    ]);
    if(cfg.data) cfg.data.forEach(r=>{
      if(r.key==='catalog_wa') salesWA=r.value||'';
      if(r.key==='catalog_sales_name') salesName=r.value||'Findest Sport';
    });
    allProducts=prods.data||[];
    renderProducts();
  }catch(e){
    console.error(e);
    document.getElementById('sectionCount').textContent='Gagal memuat produk. Cek koneksi.';
  }
  setTimeout(()=>document.getElementById('loadingScreen').classList.add('hidden'),900);
}

function setCategory(cat,btn){
  currentCategory=cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderProducts();
}

function filterProducts(){
  searchQ=document.getElementById('searchInput').value.toLowerCase();
  document.getElementById('clearSearch').style.display=searchQ?'block':'none';
  renderProducts();
}

function clearSearch(){
  document.getElementById('searchInput').value='';
  searchQ='';
  document.getElementById('clearSearch').style.display='none';
  renderProducts();
}

function getFiltered(){
  return allProducts.filter(p=>{
    const mCat=currentCategory==='all'||p.brand===currentCategory||(p.kategori||'').toLowerCase()===currentCategory.toLowerCase();
    const mQ=!searchQ||(p.nama||'').toLowerCase().includes(searchQ)||(p.brand||'').toLowerCase().includes(searchQ)||(p.kategori||'').toLowerCase().includes(searchQ)||(p.deskripsi||'').toLowerCase().includes(searchQ);
    return mCat&&mQ;
  });
}

const CAT_LABEL={all:'SEMUA PRODUK',ON:'ON — OPTIMUM NUTRITION',BSN:'BSN SUPPLEMENT',ISOPURE:'ISOPURE',Protein:'WHEY PROTEIN','Mass Gainer':'MASS GAINER',Creatine:'CREATINE',Amino:'AMINO / BCAA','Pre-Workout':'PRE-WORKOUT',Vitamin:'VITAMIN'};

function renderProducts(){
  const f=getFiltered();
  document.getElementById('sectionLabel').textContent=searchQ?`HASIL: "${searchQ.toUpperCase()}"`:CAT_LABEL[currentCategory]||'PRODUK';
  document.getElementById('sectionCount').textContent=f.length+' produk tersedia';
  const grid=document.getElementById('productGrid');
  if(!f.length){grid.innerHTML='<div class="empty-state"><div style="font-size:44px;margin-bottom:10px">🔍</div><div style="font-size:13px">Produk tidak ditemukan.</div></div>';return;}
  grid.innerHTML=f.map((p,i)=>{
    const inCart=cart[p.id]?.qty>0;
    const qty=cart[p.id]?.qty||0;
    const emoji=EMOJI[p.brand]||'📦';
    const bc=BCLS[p.brand]||'brand-ON';
    const imgEl=p.foto_url?`<img src="${p.foto_url}" alt="${p.nama}" onerror="this.style.display='none'">`:'';
    const priceEl=p.harga?`<div class="card-price">${fmt(p.harga)}</div>`:`<div class="no-price">Hubungi sales</div>`;
    const stok=p.stok!=null?parseInt(p.stok):null;
    const habis=stok===0;
    const terbatas=stok!=null&&stok>0&&stok<=10;
    const stokBadge=habis
      ?'<div class="stok-badge stok-habis">❌ Habis</div>'
      :terbatas
        ?`<div class="stok-badge stok-terbatas">⚠️ Sisa ${stok}</div>`
        :'';
    return`<div class="product-card${inCart?' in-cart':''}${habis?' habis':''}" onclick="${habis?'':'openProduct('+p.id+')'}" style="animation-delay:${i*.04}s;${habis?'cursor:default;opacity:.65':''}">      <div class="card-img-wrap">
        <div class="card-img">${imgEl||emoji}</div>
        <div class="card-badge-brand ${bc}">${p.brand}</div>
        ${p.video_url&&!habis?'<div class="card-video">▶ VIDEO</div>':''}
        ${inCart&&!habis?`<div class="card-qty-badge">${qty}</div>`:''}
        ${stokBadge}
      </div>
      <div class="card-body">
        <div class="card-name">${p.nama||'–'}</div>
        <div class="card-variant">${p.kategori||''}</div>
        ${priceEl}
        <button class="card-add-btn${inCart&&!habis?' added':''}${habis?' btn-habis':''}" ${habis?'disabled':''} onclick="${habis?'':'quickAdd(event,'+p.id+')'}">
          ${habis?'❌ Stok Habis':inCart?`✓ (${qty})`:'+ Tambah'}
        </button>
      </div>
    </div>`;
  }).join('');
}

function openProduct(id){
  selectedProduct=allProducts.find(p=>p.id===id);
  if(!selectedProduct)return;
  modalQty=cart[id]?.qty||1;
  renderProductModal();
  document.getElementById('productModal').classList.add('open');
  document.body.style.overflow='hidden';
}

function renderProductModal(){
  const p=selectedProduct;
  const emoji=EMOJI[p.brand]||'📦';
  const bc=BCLS[p.brand]||'brand-ON';
  const inCart=!!cart[p.id]?.qty;
  const sub=p.harga*modalQty;
  document.getElementById('productModalContent').innerHTML=`
    <div class="modal-img">${p.foto_url?`<img src="${p.foto_url}" alt="${p.nama}" onerror="this.style.display='none'">`:''}${emoji}</div>
    <div class="modal-body">
      <div class="modal-brand-tag ${bc}">${p.brand}</div>
      <div class="modal-name">${p.nama}</div>
      <div class="modal-variant">${p.kategori||''}</div>
      <div class="modal-price">${p.harga?fmt(p.harga):'–'} <span>/ unit</span></div>
      ${p.deskripsi?`<p class="modal-desc">${p.deskripsi}</p>`:''}
      ${p.video_url?`<div class="modal-video-btn" onclick="openVideo('${p.video_url}')"><span style="font-size:18px">▶</span><div><div>Tonton Video Produk</div><div style="font-size:10px;color:var(--muted);font-weight:400">Review & cara penggunaan</div></div></div>`:''}
      <div class="qty-control">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <div class="qty-num" id="mqn">${modalQty}</div>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
        <span style="font-size:12px;color:var(--muted)">× ${fmt(p.harga)}</span>
        <span id="msub" style="font-size:14px;font-weight:700;color:var(--teal);margin-left:auto">${fmt(sub)}</span>
      </div>
      ${(()=>{const s=p.stok!=null?parseInt(p.stok):null;const h=s===0;const t=s!=null&&s>0&&s<=10;return h?'<div style="text-align:center;padding:12px;background:rgba(255,59,92,.1);border:1px solid rgba(255,59,92,.3);border-radius:10px;color:#FF3B5C;font-size:13px;font-weight:600">❌ Stok Habis — Produk ini sedang tidak tersedia</div>':t?`<div style="margin-bottom:8px;padding:8px 12px;background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.3);border-radius:8px;color:#F5A623;font-size:12px">⚠️ Stok terbatas — tersisa ${s} unit</div><button class="add-to-cart-btn" onclick="addToCart(${p.id})">${inCart?'✓ Update Pesanan':'🛒 Tambah ke Pesanan'}</button>`:'<button class="add-to-cart-btn" onclick="addToCart(${p.id})">${inCart?'✓ Update Pesanan':'🛒 Tambah ke Pesanan'}</button>';})()}
    </div>`;
}

function changeQty(d){
  modalQty=Math.max(1,modalQty+d);
  document.getElementById('mqn').textContent=modalQty;
  document.getElementById('msub').textContent=fmt(selectedProduct.harga*modalQty);
}

function handleModalBg(e,id){if(e.target===document.getElementById(id))closeModal(id);}
function closeModal(id){document.getElementById(id).classList.remove('open');document.body.style.overflow='';}

function addToCart(id){
  const p=allProducts.find(x=>x.id===id);
  if(!p)return;
  cart[id]={product:p,qty:modalQty};
  updateCartUI();closeModal('productModal');showToast('✓ '+p.nama+' ditambah!');renderProducts();
}

function quickAdd(e,id){
  e.stopPropagation();
  const p=allProducts.find(x=>x.id===id);
  if(!p)return;
  if(p.stok!=null&&parseInt(p.stok)===0){showToast('❌ Stok habis!');return;}
  cart[id]=cart[id]?{product:p,qty:cart[id].qty+1}:{product:p,qty:1};
  updateCartUI();showToast('✓ '+p.nama+' ('+cart[id].qty+')');renderProducts();
}

function updateCartUI(){
  const items=Object.values(cart).filter(c=>c.qty>0);
  const tq=items.reduce((s,c)=>s+c.qty,0);
  const tp=items.reduce((s,c)=>s+(c.product.harga||0)*c.qty,0);
  document.getElementById('cartCount').textContent=tq;
  document.getElementById('cartTotal').textContent=fmt(tp);
  document.getElementById('cartFab').classList.toggle('hidden',tq===0);
}

function openCart(){renderCartModal();document.getElementById('cartModal').classList.add('open');document.body.style.overflow='hidden';}

function changeCartQty(id,d){
  if(!cart[id])return;
  cart[id].qty=Math.max(0,cart[id].qty+d);
  if(cart[id].qty===0)delete cart[id];
  updateCartUI();renderCartModal();renderProducts();
}

function renderCartModal(){
  const items=Object.values(cart).filter(c=>c.qty>0);
  const total=items.reduce((s,c)=>s+(c.product.harga||0)*c.qty,0);
  if(!items.length){document.getElementById('cartContent').innerHTML='<div class="empty-state"><div style="font-size:44px;margin-bottom:10px">🛒</div><div style="font-size:13px">Pesanan masih kosong.</div></div>';return;}
  const itemsHTML=items.map(c=>{
    const emoji=EMOJI[c.product.brand]||'📦';
    return`<div class="cart-item">
      <div class="cart-item-thumb">${c.product.foto_url?`<img src="${c.product.foto_url}" onerror="this.outerHTML='${emoji}'">`:''}${c.product.foto_url?'':emoji}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${c.product.nama}</div>
        <div class="cart-item-variant">${c.product.brand} · ${c.product.kategori||''}</div>
        <div class="cart-item-price">${fmt((c.product.harga||0)*c.qty)}</div>
      </div>
      <div class="cart-item-qty">
        <button class="ci-qty-btn" onclick="changeCartQty(${c.product.id},-1)">−</button>
        <div class="ci-qty-num">${c.qty}</div>
        <button class="ci-qty-btn" onclick="changeCartQty(${c.product.id},1)">+</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('cartContent').innerHTML=`
    <h2 style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;margin-bottom:3px">PESANAN KAMU</h2>
    <p style="font-size:11px;color:var(--muted);margin-bottom:14px">${items.length} produk · ${items.reduce((s,c)=>s+c.qty,0)} unit</p>
    ${itemsHTML}
    <div class="cart-total"><span>Total</span><div class="cart-total-val">${fmt(total)}</div></div>
    <div style="margin-top:14px">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;margin-bottom:10px">DATA PEMESAN</div>
      <input class="order-input" id="buyerName" placeholder="Nama lengkap kamu *" type="text"/>
      <input class="order-input" id="buyerPhone" placeholder="No. WhatsApp kamu *" type="tel"/>
      <input class="order-input" id="buyerGym" placeholder="Nama gym / outlet (opsional)" type="text"/>
      <textarea class="order-input" id="buyerNote" placeholder="Catatan: flavor, ukuran, dll..." rows="2" style="resize:none"></textarea>
      <button class="checkout-btn" onclick="sendOrder()"><span>📲</span>Kirim Order via WhatsApp</button>
      <div style="text-align:center;font-size:11px;color:var(--muted);margin-top:8px">Sales kami balas dalam <strong style="color:var(--teal)">5–15 menit</strong> ⚡</div>
    </div>`;
}

async function sendOrder(){
  const name=document.getElementById('buyerName')?.value.trim();
  const phone=document.getElementById('buyerPhone')?.value.trim();
  const gym=document.getElementById('buyerGym')?.value.trim();
  const note=document.getElementById('buyerNote')?.value.trim();
  if(!name){showToast('⚠️ Masukkan nama kamu!');return;}
  if(!phone){showToast('⚠️ Masukkan nomor WA kamu!');return;}
  const items=Object.values(cart).filter(c=>c.qty>0);
  if(!items.length){showToast('⚠️ Pesanan kosong!');return;}
  const total=items.reduce((s,c)=>s+(c.product.harga||0)*c.qty,0);
  const produkText=items.map(c=>`${c.product.brand} ${c.product.nama} x${c.qty}`).join(', ');
  try{
    await sb.from('orders').insert([{
      customer_nama:name,produk:produkText,total,status:'Pending',
      catatan:`WA: ${phone}${gym?' | Gym: '+gym:''}${note?' | Note: '+note:''}`
    }]);
  }catch(e){console.log('Order save:',e);}
  const itemsText=items.map(c=>`  • *${c.product.brand} ${c.product.nama}*\n    ${c.qty} unit × ${fmt(c.product.harga||0)} = *${fmt((c.product.harga||0)*c.qty)}*`).join('\n');
  const msg=`🏋️ *PESANAN BARU — FINDEST SPORT*\n\n👤 *Nama:* ${name}\n📱 *WA:* ${phone}${gym?'\n🏪 *Gym:* '+gym:''}\n\n━━━━━━━━━━━━━━━━\n🛒 *DETAIL PESANAN:*\n${itemsText}\n━━━━━━━━━━━━━━━━\n💰 *TOTAL: ${fmt(total)}*${note?'\n\n📝 *Catatan:* '+note:''}\n\n_via Findest Sport Digital Catalog_`;
  if(salesWA){
    window.open(`https://wa.me/${salesWA}?text=${encodeURIComponent(msg)}','_blank`);
  }else{
    try{await navigator.clipboard.writeText(msg);showToast('📋 Pesanan di-copy! (Nomor WA belum diset)');}
    catch(e){alert(msg);}
    return;
  }
  cart={};updateCartUI();closeModal('cartModal');renderProducts();showToast('✅ Order berhasil dikirim!');
}

function openVideo(url){
  let embed=url;
  const yt=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
  if(yt)embed=`https://www.youtube.com/embed/${yt[1]}?autoplay=1`;
  document.getElementById('videoFrame').src=embed;
  document.getElementById('videoOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeVideo(){
  document.getElementById('videoFrame').src='';
  document.getElementById('videoOverlay').classList.remove('open');
  document.body.style.overflow='';
}

let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

init();
</script>
</body>
</html>
