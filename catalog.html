<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Findest Sport — Catalog</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --canvas:#0A0A0A;--bg:#0A0A0A;--bg2:#0A0A0A;
  --surface:#161619;--surface2:#1F1F23;--surface3:#29292E;
  --border:rgba(178,182,189,.10);--border2:rgba(178,182,189,.18);
  --text:#F5F6F8;--muted:#9098A3;--subtle:#656A76;
  --teal:#14C6CB;--accent:#14C6CB;--gold:#FFEC6E;--red:#F24C53;
  --on:#14C6CB;--bsn:#6E9BFF;--iso:#FF6E8A;
  --font:'Inter',-apple-system,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;
}
html{scroll-behavior:smooth}
body{background:var(--canvas);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ---------- HERO ---------- */
.hero{position:relative;overflow:hidden;padding:44px 18px 36px;border-bottom:1px solid var(--border);background:var(--canvas)}
.hero-grid{display:none}
.hero-lines{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.9}
.hero>*:not(.hero-lines){position:relative;z-index:1}
.hero-eyebrow{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:2.5px;margin-bottom:18px;text-transform:uppercase;display:flex;align-items:center;gap:10px;font-weight:500}
.hero-eyebrow::before{content:'';width:18px;height:1px;background:var(--accent)}
.hero-title{font-family:var(--font);font-weight:800;font-size:clamp(40px,11vw,68px);line-height:.98;letter-spacing:-2px;margin-bottom:16px}
.hero-title .accent{color:var(--accent)}
.hero-sub{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:20px;max-width:340px}
.hero-badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{padding:6px 13px;border-radius:8px;font-size:11px;font-weight:500;letter-spacing:.2px;border:1px solid var(--border2)}
.badge.g{background:rgba(20,198,203,.08);border-color:rgba(20,198,203,.3);color:var(--accent)}
.badge.y{background:rgba(255,236,110,.06);border-color:rgba(255,236,110,.3);color:var(--gold)}

/* ---------- STATS ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border);background:var(--canvas)}
.stat{padding:18px 8px;text-align:center;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat-n{font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--text)}
.stat-l{font-size:10px;color:var(--subtle);letter-spacing:1px;text-transform:uppercase;margin-top:4px}

/* ---------- TOPBAR ---------- */
.topbar{position:sticky;top:0;z-index:100;background:rgba(10,10,10,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
.topbar-logo{font-family:var(--font);font-size:13px;font-weight:700;letter-spacing:1px;flex-shrink:0;width:34px;height:34px;background:#fff;color:#0A0A0A;border-radius:9px;display:flex;align-items:center;justify-content:center}
.search-wrap{flex:1;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 13px;transition:border-color .2s}
.search-wrap:focus-within{border-color:var(--border2)}
.search-wrap svg{width:16px;height:16px;stroke:var(--muted);flex-shrink:0}
.search-wrap input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;font-family:var(--font)}
.search-wrap input::placeholder{color:var(--subtle)}

/* ---------- CATEGORIES ---------- */
.cats{display:flex;gap:7px;overflow-x:auto;padding:14px 16px;border-bottom:1px solid var(--border);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;padding:7px 15px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;transition:all .18s;font-family:var(--font);letter-spacing:.3px}
.cat-btn:hover{color:var(--text);border-color:var(--subtle)}
.cat-btn.active{background:#fff;border-color:#fff;color:#0A0A0A;font-weight:600}

/* ---------- SECTION HEAD ---------- */
.sec-head{padding:20px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.sec-title{font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.sec-count{font-size:12px;color:var(--subtle);font-family:var(--font-mono)}

/* ---------- GRID + CARDS ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px 130px}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .2s,background .2s;position:relative;animation:cardRise .45s cubic-bezier(.16,1,.3,1) backwards}
.card:hover{border-color:var(--border2);background:var(--surface2);transform:translateY(-2px)}
.card:active{transform:scale(.97)}
.card.in-cart{border-color:var(--accent)}
.grid .card:nth-child(1){animation-delay:.02s}.grid .card:nth-child(2){animation-delay:.06s}.grid .card:nth-child(3){animation-delay:.1s}.grid .card:nth-child(4){animation-delay:.14s}.grid .card:nth-child(5){animation-delay:.18s}.grid .card:nth-child(6){animation-delay:.22s}.grid .card:nth-child(7){animation-delay:.26s}.grid .card:nth-child(8){animation-delay:.3s}
@keyframes cardRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.card-img{height:128px;display:flex;align-items:center;justify-content:center;font-size:48px;background:var(--surface2);position:relative;overflow:hidden}
.card-img img{width:85%;height:85%;object-fit:contain}
.brand-tag{position:absolute;top:8px;left:8px;font-size:9px;font-weight:600;letter-spacing:.4px;padding:3px 8px;border-radius:6px;font-family:var(--font-mono);text-transform:uppercase}
.brand-tag.ON{background:rgba(20,198,203,.14);color:var(--on);border:1px solid rgba(20,198,203,.28)}
.brand-tag.BSN{background:rgba(110,155,255,.14);color:var(--bsn);border:1px solid rgba(110,155,255,.28)}
.brand-tag.ISOPURE{background:rgba(255,110,138,.12);color:var(--iso);border:1px solid rgba(255,110,138,.28)}
.stok-tag{position:absolute;top:8px;right:8px;font-size:8px;font-weight:600;padding:3px 7px;border-radius:6px;font-family:var(--font-mono)}
.stok-tag.habis{background:var(--red);color:#fff}
.stok-tag.terbatas{background:var(--gold);color:#0A0A0A}
.card-body{padding:12px}
.card-kat{font-size:9px;color:var(--subtle);letter-spacing:.5px;margin-bottom:4px;font-family:var(--font-mono);text-transform:uppercase}
.card-name{font-size:12px;font-weight:600;line-height:1.35;margin-bottom:8px;color:var(--text)}
.card-price{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px}
.card-price.no-price{font-size:10px;color:var(--muted);font-family:var(--font)}
.add-btn{width:100%;padding:8px;background:transparent;border:1px solid var(--border2);color:var(--text);font-size:10px;font-weight:600;cursor:pointer;font-family:var(--font);letter-spacing:.5px;border-radius:8px;transition:all .18s}
.add-btn:hover{border-color:var(--accent);color:var(--accent)}
.add-btn.added{background:var(--accent);border-color:var(--accent);color:#0A0A0A}
.add-btn:disabled{background:rgba(242,76,83,.06);border-color:rgba(242,76,83,.25);color:var(--red);cursor:not-allowed}

/* ---------- CART FAB ---------- */
.cart-fab{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);z-index:150;display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;color:#0A0A0A;padding:14px 22px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .35s;white-space:nowrap;min-width:230px;border:none;font-family:var(--font);opacity:0;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.cart-fab.show{transform:translateX(-50%) translateY(0);opacity:1}
.cart-fab span{display:flex;align-items:center;gap:8px}
.cart-fab svg{width:17px;height:17px;stroke:#0A0A0A}
.fab-badge{background:#0A0A0A;color:#fff;width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--font-mono)}

/* ---------- OVERLAY / SHEET ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:var(--surface);border-top:1px solid var(--border2);border-radius:18px 18px 0 0;width:100%;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.16,1,.3,1);position:relative}
.overlay.open .sheet{transform:translateY(0)}
.drag{width:38px;height:4px;background:var(--surface3);border-radius:3px;margin:12px auto 0}
.modal-body{padding:18px 20px 44px}
.pm-img{height:210px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:72px;border-radius:12px;margin-bottom:18px;overflow:hidden;border:1px solid var(--border)}
.pm-img img{width:100%;height:100%;object-fit:contain;padding:14px}
.pm-brand{font-size:10px;font-family:var(--font-mono);letter-spacing:1.5px;margin-bottom:8px;text-transform:uppercase}
.pm-brand.ON{color:var(--on)}.pm-brand.BSN{color:var(--bsn)}.pm-brand.ISOPURE{color:var(--iso)}
.pm-name{font-size:22px;font-weight:700;line-height:1.2;margin-bottom:10px;letter-spacing:-.4px}
.pm-desc{font-size:14px;color:var(--muted);line-height:1.65;margin-bottom:16px}
.pm-price{font-family:var(--font-mono);font-size:24px;font-weight:600;color:var(--text);margin-bottom:20px}
.qty-row{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.qty-btn{width:40px;height:40px;border-radius:9px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:20px;cursor:pointer;transition:all .15s}
.qty-btn:hover{border-color:var(--accent);color:var(--accent)}
.qty-num{font-size:20px;font-weight:600;font-family:var(--font-mono);color:var(--text);min-width:30px;text-align:center}
.pm-add{width:100%;padding:15px;background:#fff;color:#0A0A0A;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);letter-spacing:.3px;border-radius:10px;transition:transform .12s}
.pm-add:active{transform:scale(.98)}

/* ---------- CART ITEMS ---------- */
.ci{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.ci-thumb{width:46px;height:46px;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden;border:1px solid var(--border)}
.ci-thumb img{width:100%;height:100%;object-fit:contain;padding:5px}
.ci-name{font-size:13px;font-weight:600;line-height:1.3}
.ci-brand{font-size:9px;color:var(--subtle);letter-spacing:.8px;font-family:var(--font-mono);margin-top:2px;text-transform:uppercase}
.ci-price{font-size:13px;color:var(--text);font-weight:600;font-family:var(--font-mono);margin-top:4px}
.ci-qty{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ciq{width:30px;height:30px;border-radius:8px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ciq:hover{border-color:var(--accent);color:var(--accent)}
.ciq-n{font-size:13px;font-weight:600;font-family:var(--font-mono);min-width:24px;text-align:center;color:var(--text)}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-top:1px solid var(--border2);margin-top:8px}
.total-val{font-family:var(--font-mono);font-size:22px;color:var(--text);font-weight:600}

/* ---------- FORM ---------- */
.f-title{font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;margin:18px 0 12px;color:var(--muted);text-transform:uppercase}
.fi{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:12px 14px;color:var(--text);font-size:14px;font-family:var(--font);outline:none;margin-bottom:9px;transition:border-color .2s}
.fi:focus{border-color:var(--border2)}
.fi::placeholder{color:var(--subtle)}
textarea.fi{resize:none}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.pay-card{border:1px solid var(--border);border-radius:11px;padding:15px;cursor:pointer;text-align:center;background:var(--surface2);transition:all .2s}
.pay-card:hover{border-color:var(--border2)}
.pay-card.sel{border-color:var(--accent);background:rgba(20,198,203,.07)}
.pay-icon{font-size:26px;margin-bottom:7px}
.pay-label{font-size:12px;font-weight:600;font-family:var(--font);letter-spacing:.3px}
.pay-sub{font-size:11px;color:var(--subtle);margin-top:3px}
.pay-info{padding:14px;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;margin-bottom:10px;display:none}
.pay-info.show{display:block}
.pay-info-label{font-size:10px;color:var(--accent);font-family:var(--font-mono);letter-spacing:1px;margin-bottom:10px;text-transform:uppercase}
.pay-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px}
.pay-row span{color:var(--muted);font-size:12px}
.pay-row b{font-family:var(--font-mono);letter-spacing:.3px;font-weight:500}
.pay-qr{width:100%;max-width:190px;border-radius:12px;margin:0 auto;display:block;background:#fff;padding:8px}
.checkout-btn{width:100%;margin-top:14px;padding:16px;background:#fff;color:#0A0A0A;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);letter-spacing:.3px;border-radius:11px;transition:transform .12s}
.checkout-btn:active{transform:scale(.98)}
.checkout-hint{text-align:center;font-size:12px;color:var(--subtle);margin-top:10px}

/* ---------- TOAST / MISC ---------- */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:11px 18px;font-size:13px;z-index:999;opacity:0;transition:all .3s;white-space:nowrap;pointer-events:none;font-family:var(--font);font-weight:500;color:var(--text)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty-state{grid-column:1/-1;text-align:center;padding:56px 20px;color:var(--muted)}
.empty-state .ei{font-size:46px;margin-bottom:14px}
.empty-state p{font-size:13px;font-family:var(--font-mono);letter-spacing:1px}
.video-ov{position:fixed;inset:0;background:#000;z-index:300;display:none;flex-direction:column}
.video-ov.open{display:flex}
.video-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px;z-index:1}
.video-ov iframe{flex:1;border:none}
</style>
</head>
<body>

<div class="hero">
  <svg class="hero-lines" viewBox="0 0 420 280" preserveAspectRatio="xMaxYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="hl1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#844FBA"/><stop offset=".5" stop-color="#14C6CB"/><stop offset="1" stop-color="#00CA8E"/></linearGradient>
    <linearGradient id="hl2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2E71E5"/><stop offset=".5" stop-color="#14C6CB"/><stop offset="1" stop-color="#FFEC6E"/></linearGradient>
    <linearGradient id="hl3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14C6CB"/><stop offset="1" stop-color="#F24C53"/></linearGradient>
  </defs>
  <g fill="none" stroke-width="1.5" stroke-linecap="round">
    <path d="M200,300 C300,250 300,120 420,90" stroke="url(#hl1)" opacity=".55" stroke-dasharray="600" stroke-dashoffset="600"><animate attributeName="stroke-dashoffset" from="600" to="0" dur="1.6s" begin="0.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/></path>
    <path d="M220,320 C320,260 330,150 420,120" stroke="url(#hl2)" opacity=".45" stroke-dasharray="600" stroke-dashoffset="600"><animate attributeName="stroke-dashoffset" from="600" to="0" dur="1.6s" begin="0.25s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/></path>
    <path d="M240,340 C340,270 360,180 420,155" stroke="url(#hl3)" opacity=".35" stroke-dasharray="600" stroke-dashoffset="600"><animate attributeName="stroke-dashoffset" from="600" to="0" dur="1.6s" begin="0.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/></path>
    <path d="M260,360 C360,290 390,210 420,195" stroke="url(#hl1)" opacity=".25" stroke-dasharray="600" stroke-dashoffset="600"><animate attributeName="stroke-dashoffset" from="600" to="0" dur="1.6s" begin="0.55s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/></path>
  </g>
</svg>
  <div class="hero-eyebrow">EXCLUSIVE DISTRIBUTOR — BALI</div>
  <h1 class="hero-title">FUEL YOUR<br><span class="accent">POTENTIAL.</span></h1>
  <p class="hero-sub">Suplemen premium ON, BSN & ISOPURE.<br>100% authentic · Harga distributor.</p>
  <div class="hero-badges">
    <span class="badge g">✓ 100% Original</span>
    <span class="badge g">✓ Exclusive ON Bali</span>
    <span class="badge y">⚡ Order via WhatsApp</span>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-n" id="sn1">—</div><div class="stat-l">Produk SKU</div></div>
  <div class="stat"><div class="stat-n">103</div><div class="stat-l">Customer Aktif</div></div>
  <div class="stat"><div class="stat-n">18</div><div class="stat-l">Outlet Bali</div></div>
</div>

<div class="topbar">
  <div class="topbar-logo">FS</div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="searchInput" placeholder="Cari produk, brand, flavor..." oninput="filterProducts()">
    <span id="clearBtn" style="color:var(--muted);cursor:pointer;display:none;font-size:14px" onclick="clearSearch()">✕</span>
  </div>
</div>

<div class="cats">
  <button class="cat-btn active" onclick="setCat('all',this)">ALL</button>
  <button class="cat-btn" onclick="setCat('ON',this)">ON</button>
  <button class="cat-btn" onclick="setCat('BSN',this)">BSN</button>
  <button class="cat-btn" onclick="setCat('ISOPURE',this)">ISOPURE</button>
  <button class="cat-btn" onclick="setCat('Protein',this)">PROTEIN</button>
  <button class="cat-btn" onclick="setCat('Mass Gainer',this)">GAINER</button>
  <button class="cat-btn" onclick="setCat('Creatine',this)">CREATINE</button>
  <button class="cat-btn" onclick="setCat('Amino',this)">AMINO</button>
  <button class="cat-btn" onclick="setCat('Pre-Workout',this)">PRE-WO</button>
  <button class="cat-btn" onclick="setCat('Vitamin',this)">VITAMIN</button>
</div>

<div class="sec-head">
  <div class="sec-title" id="secLabel">ALL PRODUCTS</div>
  <div class="sec-count" id="secCount"></div>
</div>
<div class="grid" id="productGrid">
  <div class="empty-state"><div class="ei">⏳</div><p>MEMUAT PRODUK...</p></div>
</div>

<button class="cart-fab" id="cartFab" onclick="openCart()">
  <span><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>PESANAN</span>
  <div style="display:flex;align-items:center;gap:8px">
    <span id="fabTotal" style="font-size:11px;font-family:'JetBrains Mono',monospace">Rp 0</span>
    <div class="fab-badge" id="fabCount">0</div>
  </div>
</button>

<div class="overlay" id="prodModal" onclick="bgClose(event,'prodModal')">
  <div class="sheet"><div class="drag"></div><div class="modal-body" id="prodContent"></div></div>
</div>
<div class="overlay" id="cartModal" onclick="bgClose(event,'cartModal')">
  <div class="sheet"><div class="drag"></div><div class="modal-body" id="cartContent"></div></div>
</div>
<div class="video-ov" id="videoOv">
  <button class="video-close" onclick="closeVideo()">✕</button>
  <iframe id="videoFrame" allow="autoplay"></iframe>
</div>
<div class="toast" id="toast"></div>

<script>
const SB=supabase.createClient('https://wuejoxgbtvmlrriwlofk.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1ZWpveGdidHZtbHJyaXdsb2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNjY1NTQsImV4cCI6MjA5Mjg0MjU1NH0.nq0xlsuXeJNXtb8SisPQ3Ml5fXNy2vguVRJ8pNFGai0');
let products=[],cart={},activeCat='all',searchQ='',modalQty=1,selPayment='';
let salesWA='',salesName='Findest Sport',bankNama='',bankRekening='',bankAtasNama='',qrisUrl='';
const fmt=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const EM={ON:'🏆',BSN:'💪',ISOPURE:'❄️'};

function qrFail(img){img.outerHTML='<div style="font-size:12px;color:var(--muted)">QR gagal dimuat — dikirim via WhatsApp setelah order</div>';}
function convertFotoUrl(url){
  if(!url) return '';
  // Google Drive - pakai thumbnail format (paling reliable, no CORS)
  let m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w400';
  let m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(m2) return 'https://drive.google.com/thumbnail?id='+m2[1]+'&sz=w400';
  // Jika bukan Google Drive, return as is
  return url;
}

async function init(){
  try{
    const[cfg,prods]=await Promise.all([
      SB.from('config').select('key,value'),
      SB.from('products').select('id,nama,brand,kategori,harga,foto_url,deskripsi,status,video_url,stok').eq('status','Aktif').order('brand').order('nama')
    ]);
    if(cfg.data)cfg.data.forEach(r=>{
      if(r.key==='catalog_wa'){let wa=(r.value||'').replace(/[\s\-]/g,'');if(wa.startsWith('+62'))wa=wa.slice(1);else if(wa.startsWith('08'))wa='62'+wa.slice(1);else if(wa.startsWith('8')&&!wa.startsWith('62'))wa='62'+wa;salesWA=wa;}
      if(r.key==='catalog_sales_name')salesName=r.value||'Findest Sport';
      if(r.key==='bank_nama')bankNama=r.value||'';
      if(r.key==='bank_rekening')bankRekening=r.value||'';
      if(r.key==='bank_atas_nama')bankAtasNama=r.value||'';
      if(r.key==='qris_url')qrisUrl=r.value||'';
    });
    products=prods.data||[];
    document.getElementById('sn1').textContent=products.length;
    render();
  }catch(e){
    console.error(e);
    document.getElementById('productGrid').innerHTML='<div class="empty-state"><div class="ei">⚠️</div><p>GAGAL MEMUAT — CEK KONEKSI</p></div>';
  }
}

function getFiltered(){
  return products.filter(p=>{
    const mC=activeCat==='all'||p.brand===activeCat||p.kategori===activeCat;
    const mQ=!searchQ||p.nama.toLowerCase().includes(searchQ)||p.brand.toLowerCase().includes(searchQ)||(p.kategori||'').toLowerCase().includes(searchQ);
    return mC&&mQ;
  });
}

function render(){
  const list=getFiltered();
  document.getElementById('secLabel').textContent=activeCat==='all'?'ALL PRODUCTS':activeCat.toUpperCase();
  document.getElementById('secCount').textContent=list.length+' produk';
  const grid=document.getElementById('productGrid');
  if(!list.length){grid.innerHTML='<div class="empty-state"><div class="ei">🔍</div><p>PRODUK TIDAK DITEMUKAN</p></div>';return;}
  grid.innerHTML=list.map(p=>{
    const stok=p.stok!=null?parseInt(p.stok):null;
    const habis=stok===0;
    const terbatas=stok!=null&&stok>0&&stok<=10;
    const inCart=!!cart[p.id];
    const em=EM[p.brand]||'📦';
    return `<div class="card${inCart?' in-cart':''}" onclick="openProd(${p.id})">
      <div class="card-img">
        ${p.foto_url?`<img src="${convertFotoUrl(p.foto_url)}" onerror="this.outerHTML='<span style=font-size:48px>${em}</span>'">`:`<span style="font-size:48px">${em}</span>`}
        <div class="brand-tag ${p.brand}">${p.brand}</div>
        ${habis?'<div class="stok-tag habis">HABIS</div>':terbatas?`<div class="stok-tag terbatas">SISA ${stok}</div>`:''}
      </div>
      <div class="card-body">
        <div class="card-kat">${p.kategori||''}</div>
        <div class="card-name">${p.nama}</div>
        <div class="card-price${p.harga?'':' no-price'}">${p.harga?fmt(p.harga):'Hubungi Sales'}</div>
        <button class="add-btn${inCart?' added':''}" ${habis?'disabled':''} onclick="event.stopPropagation();quickAdd(${p.id})">
          ${habis?'HABIS':inCart?'✓ ADDED':'+ ADD'}
        </button>
      </div>
    </div>`;
  }).join('');
}

function setCat(cat,btn){activeCat=cat;document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function filterProducts(){searchQ=document.getElementById('searchInput').value.trim().toLowerCase();document.getElementById('clearBtn').style.display=searchQ?'block':'none';render();}
function clearSearch(){searchQ='';document.getElementById('searchInput').value='';document.getElementById('clearBtn').style.display='none';render();}

function quickAdd(id){
  const p=products.find(x=>x.id===id);
  if(!p||p.stok===0)return;
  cart[id]=cart[id]?{product:p,qty:cart[id].qty+1}:{product:p,qty:1};
  updateFab();render();
  showToast('+ '+p.nama.substring(0,22)+'...');
}

function changeCartQty(id,d){
  if(!cart[id])return;
  cart[id].qty+=d;
  if(cart[id].qty<=0)delete cart[id];
  updateFab();openCart();
}

function updateFab(){
  const items=Object.values(cart);
  const total=items.reduce((s,c)=>s+(c.product.harga||0)*c.qty,0);
  const count=items.reduce((s,c)=>s+c.qty,0);
  document.getElementById('fabCount').textContent=count;
  document.getElementById('fabTotal').textContent=fmt(total);
  const fab=document.getElementById('cartFab');
  if(count>0)fab.classList.add('show');else fab.classList.remove('show');
}

function openOverlay(id){document.getElementById(id).classList.add('open');}
function closeOverlay(id){document.getElementById(id).classList.remove('open');}
function bgClose(e,id){if(e.target.classList.contains('overlay'))closeOverlay(id);}

function openProd(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  modalQty=1;
  const stok=p.stok!=null?parseInt(p.stok):null;
  const habis=stok===0,terbatas=stok!=null&&stok>0&&stok<=10;
  const em=EM[p.brand]||'📦',inCart=!!cart[id];
  document.getElementById('prodContent').innerHTML=`
    <div class="pm-img">${p.foto_url?`<img src="${convertFotoUrl(p.foto_url)}" onerror="this.outerHTML='<span style=font-size:72px>${em}</span>'">`:`<span style="font-size:72px">${em}</span>`}</div>
    ${p.video_url?`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;color:var(--teal);font-size:13px;font-weight:600;cursor:pointer;border-bottom:1px solid var(--border);margin-bottom:14px" onclick="openVideo('${p.video_url}')">▶ Tonton Video Produk</div>`:''}
    ${habis?`<div style="padding:10px;background:rgba(255,59,92,.08);border:1px solid var(--red);border-radius:6px;font-size:12px;color:var(--red);font-family:'JetBrains Mono',monospace;margin-bottom:14px">❌ STOK HABIS</div>`:''}
    ${terbatas&&!habis?`<div style="padding:8px 12px;background:rgba(245,166,35,.08);border:1px solid var(--gold);border-radius:6px;font-size:11px;color:var(--gold);font-family:'JetBrains Mono',monospace;margin-bottom:12px">⚠ SISA ${stok} UNIT</div>`:''}
    <div class="pm-brand ${p.brand}">${p.brand}</div>
    <div class="pm-name">${p.nama}</div>
    ${p.deskripsi?`<div class="pm-desc">${p.deskripsi}</div>`:''}
    <div class="pm-price">${p.harga?fmt(p.harga):'Hubungi Sales'}</div>
    ${!habis?`<div class="qty-row"><button class="qty-btn" onclick="chgQty(-1)">−</button><div class="qty-num" id="mqty">1</div><button class="qty-btn" onclick="chgQty(1)">+</button></div><button class="pm-add" onclick="addFromModal(${p.id})">${inCart?'✓ UPDATE PESANAN':'+ TAMBAH KE PESANAN'}</button>`:''}
  `;
  openOverlay('prodModal');
}

function chgQty(d){modalQty=Math.max(1,modalQty+d);const el=document.getElementById('mqty');if(el)el.textContent=modalQty;}

function addFromModal(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  cart[id]={product:p,qty:modalQty};
  updateFab();render();closeOverlay('prodModal');
  showToast(`✓ ${p.nama.substring(0,20)}... x${modalQty}`);
}

function openCart(){
  const items=Object.values(cart).filter(c=>c.qty>0);
  if(!items.length){showToast('Cart kosong!');return;}
  const total=items.reduce((s,c)=>s+(c.product.harga||0)*c.qty,0);
  document.getElementById('cartContent').innerHTML=`
    <div style="font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;letter-spacing:2px;margin-bottom:4px">PESANAN</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:14px;font-family:'JetBrains Mono',monospace">${items.length} PRODUK · ${items.reduce((s,c)=>s+c.qty,0)} UNIT</div>
    ${items.map(c=>{const em=EM[c.product.brand]||'📦';return`<div class="ci"><div class="ci-thumb">${c.product.foto_url?`<img src="${convertFotoUrl(c.product.foto_url)}" onerror="this.outerHTML='${em}'">`:`${em}`}</div><div style="flex:1;min-width:0"><div class="ci-name">${c.product.nama}</div><div class="ci-brand">${c.product.brand}</div><div class="ci-price">${fmt((c.product.harga||0)*c.qty)}</div></div><div class="ci-qty"><button class="ciq" onclick="changeCartQty(${c.product.id},-1)">−</button><div class="ciq-n">${c.qty}</div><button class="ciq" onclick="changeCartQty(${c.product.id},1)">+</button></div></div>`;}).join('')}
    <div class="total-row"><span style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px">TOTAL</span><div class="total-val">${fmt(total)}</div></div>
    <div class="f-title">DATA PEMESAN</div>
    <input class="fi" id="buyerName" placeholder="Nama lengkap *" type="text">
    <input class="fi" id="buyerPhone" placeholder="No. WhatsApp *" type="tel">
    <input class="fi" id="buyerGym" placeholder="Nama gym / outlet (opsional)" type="text">
    <input class="fi" id="buyerAddress" placeholder="Alamat pengiriman (opsional)" type="text">
    <textarea class="fi" id="buyerNote" placeholder="Catatan: flavor, ukuran, dll..." rows="2"></textarea>
    <div class="f-title">METODE PEMBAYARAN</div>
    <div class="pay-grid">
      <div class="pay-card" id="pc-qris" onclick="selPay('QRIS')"><div class="pay-icon">💳</div><div class="pay-label">QRIS</div><div class="pay-sub">Scan & Pay</div></div>
      <div class="pay-card" id="pc-transfer" onclick="selPay('Transfer Bank')"><div class="pay-icon">🏦</div><div class="pay-label">TRANSFER</div><div class="pay-sub">Via rekening</div></div>
    </div>
    <div class="pay-info" id="info-qris">
      <div class="pay-info-label">💳 QRIS</div>
      ${qrisUrl?`<img class="pay-qr" src="${convertFotoUrl(qrisUrl)}" onerror="qrFail(this)">`:`<div style="font-size:12px;color:var(--muted)">QR dikirim via WhatsApp setelah order</div>`}
    </div>
    <div class="pay-info" id="info-transfer">
      <div class="pay-info-label">🏦 INFO TRANSFER</div>
      ${bankNama||bankRekening?`<div class="pay-row"><span>Bank</span><b>${bankNama}</b></div><div class="pay-row"><span>Rekening</span><b>${bankRekening}</b></div><div class="pay-row"><span>Atas Nama</span><b>${bankAtasNama}</b></div>`:`<div style="font-size:12px;color:var(--muted)">Info rekening dikonfirmasi via WhatsApp</div>`}
    </div>
    <button class="checkout-btn" onclick="sendOrder()">📲 KIRIM ORDER VIA WHATSAPP</button>
    <div class="checkout-hint">Sales kami balas dalam <strong style="color:var(--teal)">5–15 menit</strong> ⚡</div>
  `;
  selPayment='';
  openOverlay('cartModal');
}

function selPay(method){
  selPayment=method;
  document.querySelectorAll('.pay-card').forEach(c=>c.classList.remove('sel'));
  document.getElementById(method==='QRIS'?'pc-qris':'pc-transfer').classList.add('sel');
  document.getElementById('info-qris').classList.toggle('show',method==='QRIS');
  document.getElementById('info-transfer').classList.toggle('show',method==='Transfer Bank');
}

async function sendOrder(){
  const name=document.getElementById('buyerName')?.value.trim();
  const phone=document.getElementById('buyerPhone')?.value.trim();
  const gym=document.getElementById('buyerGym')?.value.trim();
  const address=document.getElementById('buyerAddress')?.value.trim();
  const note=document.getElementById('buyerNote')?.value.trim();
  if(!name){showToast('⚠ Masukkan nama kamu!');return;}
  if(!phone){showToast('⚠ Masukkan nomor WA!');return;}
  if(!selPayment){showToast('⚠ Pilih metode pembayaran!');return;}
  const items=Object.values(cart).filter(c=>c.qty>0);
  if(!items.length){showToast('⚠ Cart kosong!');return;}
  const total=items.reduce((s,c)=>s+(c.product.harga||0)*c.qty,0);
  const itemsText=items.map(c=>`  • *${c.product.brand} ${c.product.nama}*\n    ${c.qty} unit × ${fmt(c.product.harga||0)} = *${fmt((c.product.harga||0)*c.qty)}*`).join('\n');
  const msg=`🏋️ *PESANAN BARU — FINDEST SPORT*\n\n👤 *Nama:* ${name}\n📱 *WA:* ${phone}${gym?'\n🏪 *Gym:* '+gym:''}${address?'\n📍 *Alamat:* '+address:''}\n💳 *Pembayaran:* ${selPayment}\n\n━━━━━━━━━━━━━━━━\n🛒 *DETAIL PESANAN:*\n${itemsText}\n━━━━━━━━━━━━━━━━\n💰 *TOTAL: ${fmt(total)}*${note?'\n\n📝 *Catatan:* '+note:''}\n\n_via Findest Sport Digital Catalog_`;
  // Buka WA dulu SEBELUM await — hindari popup blocker!
  if(salesWA){
    window.open('https://wa.me/'+salesWA+'?text='+encodeURIComponent(msg),'_blank');
  }else{
    try{await navigator.clipboard.writeText(msg);showToast('📋 Order di-copy! (No WA belum diset)');}
    catch(e){alert(msg);}
    return;
  }
  // Background: simpan ke Supabase
  try{
    const produkText=items.map(c=>`${c.product.brand} ${c.product.nama} x${c.qty}`).join(', ');
    await SB.from('orders').insert([{customer_nama:name,produk:produkText,total,status:'Pending',catatan:`WA: ${phone}${gym?' | Gym: '+gym:''}${address?' | Alamat: '+address:''}${selPayment?' | Bayar: '+selPayment:''}${note?' | Note: '+note:''}`}]);
  }catch(e){console.log('Order save:',e);}
  cart={};updateFab();closeOverlay('cartModal');render();
  showToast('✅ Order berhasil dikirim!');
}

function openVideo(url){let e=url;const yt=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);if(yt)e='https://www.youtube.com/embed/'+yt[1]+'?autoplay=1';document.getElementById('videoFrame').src=e;document.getElementById('videoOv').classList.add('open');}
function closeVideo(){document.getElementById('videoOv').classList.remove('open');document.getElementById('videoFrame').src='';}

let toastTimer;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500);}

// START
init();
</script>
</body>
</html>
